[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pocketbench"
version = "0.1.0"
description = "PocketBench: a perturbation-based reliability benchmark for structure-based drug design generative models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.23",
  "pandas>=2.0",
  "rdkit>=2023.3.1",
  "biopython>=1.81",
  "matplotlib>=3.7",
  "seaborn>=0.13",
  "torch>=2.0",
  "pyyaml>=6.0",
  "omegaconf>=2.3",
  "scipy>=1.10",
]

[project.optional-dependencies]
vina = [
  "meeko>=0.5.0",
  "gemmi",
  'vina>=1.2.2; platform_system != "Windows"',
]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
pocketbench = "sbdd_robust.cli:main"
sbdd-robust = "sbdd_robust.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sbdd_robust*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
