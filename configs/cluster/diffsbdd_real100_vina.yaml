# DiffSBDD real100 panel with inline AutoDock Vina scoring (cluster Job A).
# Panel: frozen configs/diffsbdd_real100.yaml pockets (100 listed; ~99 succeed with skip_failed).
# Conditions: original + 4 featurization/boundary tags; n_samples=20.
#
# Requires (see cluster/env.example.sh):
#   DIFFSBDD_REPO, DIFFSBDD_CHECKPOINT, DIFFSBDD_PYTHON (optional), VINA_EXE
#   meeko in the conda env (receptor/ligand PDBQT); vina CLI or python vina package
#
# Submit (do not run from Windows without POSIX paths):
#   source cluster/env.local.sh
#   bash cluster/submit.sh --config configs/cluster/diffsbdd_real100_vina.yaml --job-name pb-real100-vina --dry-run
#
project_root: .
seed: 0
run_id: diffsbdd_real100_vina
paths:
  results: data/results
  generations: data/generations
extraction_radius: 8.0
skip_failed_pockets: true
brittleness_std_threshold: 0.05
invariant_tags:
- atom_shuffle
- coordinate_jitter
- crop_radius_plus_1.5
- crop_radius_minus_1.5
